name: ci

on:
  push:
    branches: ["main", "review/**", "dev"]
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ["3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: |
          python -m pip install -U pip
          python -m pip install -e .
          python -m pip install pytest
      - name: Unit + probe + security tests
        run: |
          python -c "import os; os.makedirs('reports', exist_ok=True)"
          python -m pytest -q --junitxml=reports/junit.xml
      - name: Harness conformance probes (offline, scripted provider)
        run: |
          set -o pipefail
          jinlin-agent eval --suite all | tee reports/eval.txt
        shell: bash
      - name: Rescue lifecycle smoke test (isolated temporary workspace)
        run: |
          python scripts/rescue_smoke.py
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-${{ matrix.os }}-py${{ matrix.python }}
          path: reports/
          if-no-files-found: ignore

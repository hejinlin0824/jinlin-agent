[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jinlin-code-agent"
version = "0.1.0"
description = "A production-grade code engineer agent harness: event-sourced, verifiable, recoverable, sandboxed."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Jinlin" }]
# Zero runtime dependencies on purpose: `pip install -e .` works offline.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
jinlin-agent = "jinlin_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
jinlin_agent = ["prompts/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
